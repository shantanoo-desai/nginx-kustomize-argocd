worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;

        default_type text/plain;

        location / {
            return 200 "Hello from NGINX - config v3\n";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
